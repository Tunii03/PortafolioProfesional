<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1120"/>
      <stop offset="1" stop-color="#111B2E"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
    <radialGradient id="halo1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="120" cy="70" r="420" fill="url(#halo1)"/>
  <circle cx="1120" cy="560" r="400" fill="url(#halo2)"/>

  <!-- barra lateral de acento -->
  <rect x="90" y="150" width="6" height="330" rx="3" fill="url(#accent)"/>

  <!-- nombre -->
  <text x="140" y="246" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="74" font-weight="700" fill="#E8EDF5" letter-spacing="-1.5">Juan Ignacio Tuninetti</text>

  <!-- rol -->
  <text x="140" y="328" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="40" font-weight="600" fill="url(#accent)">Estudiante avanzado de Ingeniería en Sistemas</text>

  <!-- linea divisoria -->
  <rect x="140" y="372" width="300" height="2" rx="1" fill="#94A3B8" opacity="0.25"/>

  <!-- especialidades -->
  <text x="140" y="428" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="29" font-weight="400" fill="#94A3B8">Análisis funcional · Gestión de proyectos · Análisis de datos</text>

  <!-- url -->
  <text x="140" y="500" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="26" font-weight="500" fill="#64748B">juantuninetti.vercel.app</text>
</svg>
